<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tree Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b5e3b">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Tree Assessment Schedule</title>
<style>
  :root {
    --green: #1b5e3b;
    --green-dark: #13462c;
    --green-soft: #e8f3ec;
    --line: #c3cdc7;
    --ink: #1a1a1a;
    --muted: #5c6b62;
    --bg: #e9eee9;
    --card: #fff;
    --danger: #a32020;
    --header-h: 0px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  button, a, .btn { touch-action: manipulation; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 16px;
    line-height: 1.35;
  }
  header.app {
    background: var(--green);
    color: #fff;
    padding: calc(8px + var(--safe-top)) 12px 8px;
  }
  header.app h1 { margin: 0; font-size: 17px; font-weight: 700; }
  header.app .sub { margin: 2px 0 0; font-size: 11px; opacity: .88; }
  header.app .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    margin-top: 8px;
  }
  header.app label.job {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    flex: 1;
    min-width: 160px;
  }
  header.app input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 16px;
    background: #fff;
    color: var(--ink);
  }
  .count {
    background: rgba(255,255,255,.16);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    white-space: nowrap;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    background: #f4f7f5;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  button, .btn {
    appearance: none;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    min-height: 40px;
  }
  button.secondary, .btn.secondary {
    background: #fff;
    color: var(--green-dark);
    border-color: #9cb8a8;
  }
  button.danger {
    background: #fff;
    color: var(--danger);
    border-color: #e0b4b4;
  }
  button:disabled { opacity: .4; cursor: default; }
  button:active { transform: translateY(1px); }
  .pager {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--green-dark);
    white-space: nowrap;
  }
  .search { flex: 1; min-width: 140px; }
  .search input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 16px;
    font-family: inherit;
    min-height: 40px;
  }
  main { padding: 8px 10px calc(16px + var(--safe-bottom)); }
  body.numpad-open main { padding-bottom: 280px; }
  .sheet-wrap {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: #fff;
    border: 1px solid #8fa196;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  table.sheet {
    border-collapse: collapse;
    width: 100%;
    min-width: 780px;
    table-layout: fixed;
    font-size: 15px;
  }
  table.sheet th, table.sheet td {
    border: 1px solid #b7c2bb;
    padding: 0;
    vertical-align: middle;
  }
  table.sheet th {
    background: #1b5e3b;
    color: #fff;
    font-weight: 600;
    font-size: 13px;
    padding: 7px 6px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 5;
    white-space: nowrap;
  }
  table.sheet th .u { display: block; font-weight: 400; font-size: 10px; opacity: .85; }
  table.sheet col.c-num { width: 36px; }
  table.sheet col.c-batch { width: 88px; }
  table.sheet col.c-tree { width: 110px; }
  table.sheet col.c-sp { width: auto; }
  table.sheet col.c-h, table.sheet col.c-s, table.sheet col.c-dbh { width: 72px; }
  table.sheet col.c-def { width: 200px; }
  table.sheet col.c-act { width: 44px; }
  table.sheet td.num {
    text-align: center;
    color: #4d5c54;
    font-size: 12px;
    background: #eef3ef;
    font-variant-numeric: tabular-nums;
  }
  table.sheet td.act { text-align: center; padding: 2px; background: #f7faf8; }
  table.sheet td input {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 8px 6px;
    font-size: 16px;
    font-family: inherit;
    min-height: 44px;
    -webkit-user-select: text;
    user-select: text;
  }
  table.sheet td.num-col input { text-align: center; font-variant-numeric: tabular-nums; }
  table.sheet tbody tr:nth-child(even) { background: #f6faf7; }
  table.sheet tbody tr.active { background: #e7f4eb; }
  table.sheet td input:focus {
    outline: 2px solid var(--green);
    outline-offset: -2px;
    background: #fffef4;
  }
  table.sheet td.def-cell { position: relative; }
  table.sheet td.def-cell input { padding-right: 36px; }
  table.sheet button.pick, table.sheet button.icon {
    min-height: 32px;
    padding: 2px 6px;
    font-size: 12px;
    background: #fff;
    border-radius: 6px;
  }
  table.sheet button.pick {
    position: absolute;
    right: 3px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--green-dark);
    border-color: #c5d5cb;
  }
  table.sheet button.icon { color: var(--danger); border-color: #efd0d0; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: #123526;
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 60;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    max-width: 90vw;
  }
  body.numpad-open .toast { bottom: 270px; }
  .toast.show { opacity: 1; }
  dialog.modal {
    border: 0;
    border-radius: 14px;
    padding: 0;
    width: min(520px, 94vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  dialog.modal::backdrop { background: rgba(0,0,0,.45); }
  .modal-body { padding: 18px 18px 16px; }
  .modal-body h3 { margin: 0 0 8px; font-size: 17px; }
  .modal-body p { margin: 0 0 14px; color: var(--muted); }
  .defect-list {
    max-height: 50vh;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 8px 0 12px;
  }
  .defect-list button {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 0;
    border-bottom: 1px solid #eee;
    border-radius: 0;
    min-height: 44px;
    padding: 8px 12px;
  }
  .defect-list button:last-child { border-bottom: 0; }
  .defect-list button.on { background: var(--green-soft); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
  .chip {
    background: var(--green-soft);
    color: var(--green-dark);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #file { display: none; }
  #numpad {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: #cfd6d1;
    border-top: 1px solid #9aa59e;
    padding: 8px 10px calc(8px + var(--safe-bottom));
    box-shadow: 0 -6px 20px rgba(0,0,0,.16);
  }
  body.numpad-open #numpad { display: block; }
  .numpad-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 420px;
    margin: 0 auto 6px;
  }
  .numpad-bar .lab { flex: 1; font-weight: 700; color: var(--green-dark); font-size: 14px; }
  .numpad-bar button { min-height: 40px; padding: 6px 12px; }
  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    max-width: 420px;
    margin: 0 auto;
  }
  .numpad-grid button {
    min-height: 50px;
    font-size: 22px;
    font-weight: 650;
    background: #fff;
    color: #111;
    border: 1px solid #b0b8b3;
    border-radius: 8px;
  }
  .numpad-grid button.wide { font-size: 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 16px;
    font-family: inherit;
    min-height: 42px;
  }
  .field input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  @media print {
    header.app .meta, .toolbar, #numpad, td.act, th.act, button, .search { display: none !important; }
    body, body.numpad-open { padding: 0; background: #fff; }
    main { padding: 0; }
    .sheet-wrap { box-shadow: none; border: 0; overflow: visible; }
  }
</style>
</head>
<body>
<header class="app">
  <h1>Tree Assessment Schedule</h1>
  <p class="sub">離線記錄 · 資料只存在呢部裝置 · 可匯出 Excel　·　每頁 10 項，好似 Excel 列表</p>
  <div class="meta">
    <label class="job">工程／檔名 <input id="job" type="text" placeholder="可選，用於匯出檔名" autocomplete="off"></label>
    <div class="count" id="count">已記錄 0 棵</div>
  </div>
</header>
<div class="toolbar">
  <div class="pager">
    <button type="button" class="secondary" id="btnPrev">上一頁</button>
    <span id="pageLabel">第 1 / 1 頁</span>
    <button type="button" class="secondary" id="btnNext">下一頁</button>
  </div>
  <button type="button" id="btnExport">匯出 Excel</button>
  <button type="button" class="secondary" id="btnImport">匯入 Excel</button>
  <button type="button" class="secondary" id="btnHtml">下載 HTML 備份</button>
  <button type="button" class="danger" id="btnClear">清除全部</button>
  <div class="search"><input id="q" type="search" placeholder="搜尋 Tree No.／品種／缺陷" autocomplete="off"></div>
  <input id="file" type="file" accept=".xlsx,.xlsm,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv">
</div>
<main>
  <div class="sheet-wrap" id="wrap">
    <table class="sheet" id="table">
      <colgroup>
        <col class="c-num"><col class="c-batch"><col class="c-tree"><col class="c-sp">
        <col class="c-h"><col class="c-s"><col class="c-dbh"><col class="c-def"><col class="c-act">
      </colgroup>
      <thead>
        <tr>
          <th>#</th>
          <th>Batch</th>
          <th>Tree No.</th>
          <th>Species Name</th>
          <th>H <span class="u">m</span></th>
          <th>S <span class="u">m</span></th>
          <th>DBH <span class="u">mm</span></th>
          <th>Defect</th>
          <th class="act"></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<div id="numpad">
  <div class="numpad-bar">
    <div class="lab" id="numpadLabel">H（m）</div>
    <button type="button" class="secondary" id="numpadNext">下一個</button>
    <button type="button" id="numpadDone">完成</button>
  </div>
  <div class="numpad-grid" id="numpadGrid"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog class="modal" id="importDlg">
  <div class="modal-body">
    <h3>匯入資料</h3>
    <p id="importMsg"></p>
    <div class="modal-actions">
      <button type="button" class="secondary" id="importCancel">取消</button>
      <button type="button" class="secondary" id="importAppend">加到後面</button>
      <button type="button" id="importReplace">取代現有</button>
    </div>
  </div>
</dialog>
<dialog class="modal" id="defectDlg">
  <div class="modal-body">
    <h3>選擇缺陷</h3>
    <div class="field"><input id="defectFilter" type="search" placeholder="搜尋缺陷"></div>
    <div class="chips" id="defectChips"></div>
    <div class="defect-list" id="defectChoices"></div>
    <div class="modal-actions">
      <button type="button" class="secondary" id="defectClear">清空已選</button>
      <button type="button" id="defectDone">完成</button>
    </div>
  </div>
</dialog>
<script id="data-store" type="application/json">null</script>
<datalist id="speciesList"></datalist>
<datalist id="defectList"></datalist>
<script>
const STORAGE_KEY = "field-tree-schedule-v1";
const PAGE_SIZE = 10;
const COLS = [
  { key: "batch", label: "Batch" },
  { key: "treeNo", label: "Tree No." },
  { key: "species", label: "Species Name" },
  { key: "h", label: "H", unit: "m" },
  { key: "s", label: "S", unit: "m" },
  { key: "dbh", label: "DBH", unit: "mm" },
  { key: "defect", label: "Defect" }
];
const DEFECTS = ["Abnormal bark crack on branch","Abnormal bark crack on trunk","Abnormal leaf size","Asymmetric crown","Bee hive","Bending","Bird nest","Borer Frass","Borer holes","Branch topped","Broken branch","Broken branches","Bulge","Burls","Canker","Cavity on branch","Cavity on roots","Cavity on trunk","Chlorotic leaves","Climbers","Collapsed","Co-dominant branches","Co-dominant branches with included bark","Co-dominant trunks","Co-dominant trunks with included bark","Conflict with building","Conflict with traffic","Crack","Crack on branch","Crack on root","Crooks","Cross branches","Cross trunks","Dead branch","Dead branches","Dead frond","Dead fronds","Dead stub","Dead surface root","Dead tree","Dead trunk","Dead twigs","Decay on branch","Decay on roots","Decay on trunk","Dehydrated trunk","Dieback","Drooping branches","Epicormics","Epiphytic plant","Exposed dead wood on branch","Exposed dead wood on trunk","Exposed root","Fissures on branches","Fungal fruiting bodies on branch","Fungal fruiting bodies on root","Fungal fruiting bodies on trunk","Fungal fruiting bodies on trunk base","Fungal fruiting body on branch","Fungal fruiting body on root","Fungal fruiting body on trunk","Fungal fruiting body on trunk base","Fungi","Gall","Galls","Girdling roots","Hanger","Heavy lateral branch","Imbalanced crown","Included bark","Included bark with response growth","Invisible root flare","Leader broken","Leaning","Leaning due to phototropism","Leaning with self-correction","Leaning with staking","Leaning without root-plate movement","Lion tailing","Low live crown ratio","Main trunk broken","Mechanical injury","Minor dead branch","Minor dieback","Minor sap flow","Missing leader","Multiple trunks","Narrowing trunk","Old termite track","On slope","Overgrown","Over-extending branch","Parasitic plant","Penciling","Poor health","Poor taper","Previous root-plate movement","Pruning wound on branch","Pruning wound on trunk","Reduced crown","Removed","Restricted root growth","Root plate movement","Sap flow","Seasonal defoliation","Severely sparse foliage","Sign of borer","Sign of pest","Sign of pest infestation","Sign of Phauda flammans infestation","Slightly leaning","Small crown size","Sparse foliage","Spiral grain","Split","Split on branch","Split on root","Stump","Strangled by ficus seedling","Sunscald","Suspected BRRD","Suspected hollow by sounding test","Swelling","Tearing wound","Termite mud tubes","Termite track","Termite track live termite","Topped","Tree located at drainage channel embankment","Tree located near hoarding","Trunk conflict with railing","Uprooted","V-shaped crotch with included bark","Wilted apical bud","Wilted crown","Wilting","Wilting fronds","Within construction site","Wound on branch","Wound on roots","Wound on trunk","Wound on trunk union","Wound sealed by concrete"];

const state = { job: "", rows: [], page: 0, pendingImport: null, defectTarget: null, numTarget: null };

function emptyRow() {
  return { batch: "", treeNo: "", species: "", h: "", s: "", dbh: "", defect: "" };
}
function isFilled(row) {
  return COLS.some(c => String(row[c.key] || "").trim() !== "");
}
function filledCount() {
  return state.rows.filter(isFilled).length;
}
function uid() {
  return "r" + Math.random().toString(36).slice(2, 9);
}
function emptyRowWithId() {
  const r = emptyRow();
  r.id = uid();
  return r;
}
function filteredIndexes() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const idx = [];
  state.rows.forEach((row, i) => {
    if (!q) { idx.push(i); return; }
    const hay = COLS.map(c => row[c.key] || "").join(" ").toLowerCase();
    if (hay.includes(q)) idx.push(i);
  });
  return idx;
}
function pageCount() {
  return Math.max(1, Math.ceil(filteredIndexes().length / PAGE_SIZE));
}
function padToPageMultiple() {
  if (document.getElementById("q").value.trim()) return;
  if (!state.rows.length) {
    for (let i = 0; i < PAGE_SIZE; i++) state.rows.push(emptyRowWithId());
    return;
  }
  const rem = state.rows.length % PAGE_SIZE;
  if (rem !== 0) {
    for (let i = 0; i < PAGE_SIZE - rem; i++) state.rows.push(emptyRowWithId());
  }
}

function load() {
  let data = null;
  const embedded = document.getElementById("data-store").textContent.trim();
  if (embedded && embedded !== "null") {
    try { data = JSON.parse(embedded); } catch (e) {}
  }
  if (!data) {
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) {}
  }
  if (data && Array.isArray(data.rows)) {
    state.job = data.job || "";
    state.rows = data.rows.map(r => Object.assign(emptyRow(), r, { id: r.id || uid() }));
    if (typeof data.page === "number") state.page = data.page;
  }
  padToPageMultiple();
  if (state.page > pageCount() - 1) state.page = 0;
}

function save() {
  const payload = { job: state.job, rows: state.rows, page: state.page, savedAt: new Date().toISOString() };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function isNumKey(key) {
  return key === "h" || key === "s" || key === "dbh";
}

function bindNumInput(input) {
  input.setAttribute("inputmode", "none");
  input.setAttribute("autocomplete", "off");
  input.setAttribute("autocorrect", "off");
  input.setAttribute("spellcheck", "false");
  input.addEventListener("focus", () => showKeypad(input));
  input.addEventListener("keydown", ev => {
    if (ev.key === "Enter") { ev.preventDefault(); numpadAdvance(); }
  });
}

function render() {
  padToPageMultiple();
  const pages = pageCount();
  if (state.page >= pages) state.page = pages - 1;
  if (state.page < 0) state.page = 0;
  document.getElementById("job").value = state.job;
  document.getElementById("count").textContent = "已記錄 " + filledCount() + " 棵";
  document.getElementById("pageLabel").textContent = "第 " + (state.page + 1) + " / " + pages + " 頁";
  document.getElementById("btnPrev").disabled = state.page <= 0;
  document.getElementById("btnNext").disabled = false;
  const indexes = filteredIndexes();
  const start = state.page * PAGE_SIZE;
  const slice = indexes.slice(start, start + PAGE_SIZE);
  const tb = document.getElementById("tbody");
  const keepId = state.numTarget && state.numTarget.closest ? (state.numTarget.closest("tr") && state.numTarget.dataset.key) : null;
  const keepRowId = state.numTarget && state.numTarget.closest && state.numTarget.closest("tr") ? state.numTarget.closest("tr").dataset.id : null;
  const keepKey = state.numTarget ? state.numTarget.dataset.key : null;
  tb.replaceChildren();
  slice.forEach((rowIndex) => {
    const row = state.rows[rowIndex];
    const tr = document.createElement("tr");
    tr.dataset.id = row.id;
    tr.dataset.index = String(rowIndex);
    const num = document.createElement("td");
    num.className = "num";
    num.textContent = String(rowIndex + 1);
    tr.appendChild(num);
    COLS.forEach(c => {
      const td = document.createElement("td");
      if (isNumKey(c.key)) td.className = "num-col";
      if (c.key === "defect") td.className = "def-cell";
      const input = document.createElement("input");
      input.value = row[c.key] || "";
      input.dataset.key = c.key;
      input.setAttribute("aria-label", c.label);
      if (c.key === "species") input.setAttribute("list", "speciesList");
      if (c.key === "defect") input.setAttribute("list", "defectList");
      if (isNumKey(c.key)) bindNumInput(input);
      input.addEventListener("input", ev => {
        row[c.key] = ev.target.value;
        save();
        updateCountAndLists();
      });
      input.addEventListener("focus", () => {
        document.querySelectorAll("table.sheet tbody tr").forEach(r => r.classList.remove("active"));
        tr.classList.add("active");
      });
      td.appendChild(input);
      if (c.key === "defect") {
        const pick = document.createElement("button");
        pick.type = "button";
        pick.className = "pick";
        pick.textContent = "選";
        pick.title = "選擇缺陷";
        pick.addEventListener("click", ev => {
          ev.preventDefault();
          ev.stopPropagation();
          hideKeypad();
          state.defectTarget = row.id;
          document.getElementById("defectFilter").value = "";
          renderDefectPicker();
          document.getElementById("defectDlg").showModal();
        });
        td.appendChild(pick);
      }
      tr.appendChild(td);
    });
    const act = document.createElement("td");
    act.className = "act";
    const del = document.createElement("button");
    del.type = "button";
    del.className = "icon";
    del.textContent = "刪";
    del.title = "刪除此列";
    del.addEventListener("click", () => {
      if (isFilled(row) && !confirm("刪除第 " + (rowIndex + 1) + " 列？")) return;
      hideKeypad();
      state.rows.splice(rowIndex, 1);
      padToPageMultiple();
      save();
      render();
    });
    act.appendChild(del);
    tr.appendChild(act);
    tb.appendChild(tr);
  });
  // if this page has fewer than 10 because of search, leave as-is
  updateCountAndLists();
  if (keepRowId && keepKey) {
    const el = document.querySelector('tr[data-id="' + keepRowId + '"] input[data-key="' + keepKey + '"]');
    if (el) {
      state.numTarget = el;
      el.focus({ preventScroll: true });
    }
  }
}

function updateCountAndLists() {
  document.getElementById("count").textContent = "已記錄 " + filledCount() + " 棵";
  const names = [...new Set(state.rows.map(r => (r.species || "").trim()).filter(Boolean))].sort((a,b) => a.localeCompare(b));
  const dl = document.getElementById("speciesList");
  dl.replaceChildren();
  names.forEach(n => {
    const o = document.createElement("option");
    o.value = n;
    dl.appendChild(o);
  });
}

function goPage(delta) {
  hideKeypad();
  const pages = pageCount();
  if (delta > 0 && state.page >= pages - 1) {
    if (document.getElementById("q").value.trim()) return;
    for (let i = 0; i < PAGE_SIZE; i++) state.rows.push(emptyRowWithId());
    state.page += 1;
    save();
    render();
    const first = document.querySelector("#tbody tr input[data-key='batch']");
    if (first) first.focus();
    return;
  }
  state.page = Math.max(0, Math.min(pages - 1, state.page + delta));
  save();
  render();
}

/* ---------- numeric keypad ---------- */
const NUMPAD_KEYS = ["1","2","3","4","5","6","7","8","9",".","0","⌫"];
const NUM_LABELS = { h: "H（高度 m）", s: "S（冠幅 m）", dbh: "DBH（胸徑 mm）" };
const NUM_ORDER = ["h","s","dbh"];

function showKeypad(input) {
  state.numTarget = input;
  const key = input.dataset.key;
  document.getElementById("numpadLabel").textContent = NUM_LABELS[key] || key;
  document.body.classList.add("numpad-open");
  setTimeout(() => {
    input.scrollIntoView({ block: "center", inline: "nearest" });
  }, 50);
}
function hideKeypad() {
  document.body.classList.remove("numpad-open");
  state.numTarget = null;
}
function numpadPress(key) {
  const input = state.numTarget;
  if (!input) return;
  let v = String(input.value || "");
  if (key === "⌫") v = v.slice(0, -1);
  else if (key === ".") {
    if (v.includes(".")) return;
    v = v === "" ? "0." : v + ".";
  } else {
    v += key;
  }
  input.value = v;
  input.dispatchEvent(new Event("input", { bubbles: true }));
}
function numpadAdvance() {
  const input = state.numTarget;
  if (!input) return;
  const tr = input.closest("tr");
  const key = input.dataset.key;
  const i = NUM_ORDER.indexOf(key);
  if (i >= 0 && i < NUM_ORDER.length - 1) {
    const next = tr.querySelector('input[data-key="' + NUM_ORDER[i + 1] + '"]');
    if (next) { next.focus(); return; }
  }
  const nextRow = tr.nextElementSibling;
  if (nextRow) {
    const next = nextRow.querySelector('input[data-key="h"]');
    if (next) { next.focus(); return; }
  }
  // last cell on this page: go next page and focus H
  if (state.page < pageCount() - 1 || !document.getElementById("q").value.trim()) {
    goPage(1);
    const first = document.querySelector("#tbody tr input[data-key='h']");
    if (first) first.focus();
  } else {
    hideKeypad();
  }
}

function initNumpad() {
  const grid = document.getElementById("numpadGrid");
  NUMPAD_KEYS.forEach(k => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = k;
    if (k === "⌫") b.className = "wide";
    b.addEventListener("pointerdown", ev => {
      ev.preventDefault();
      ev.stopPropagation();
      numpadPress(k);
    });
    grid.appendChild(b);
  });
  document.getElementById("numpadDone").addEventListener("pointerdown", ev => {
    ev.preventDefault();
    hideKeypad();
  });
  document.getElementById("numpadNext").addEventListener("pointerdown", ev => {
    ev.preventDefault();
    ev.stopPropagation();
    numpadAdvance();
  });
  document.addEventListener("pointerdown", ev => {
    if (!document.body.classList.contains("numpad-open")) return;
    if (ev.target.closest("#numpad")) return;
    if (ev.target.matches && ev.target.matches("input") && isNumKey(ev.target.dataset.key)) return;
    hideKeypad();
  });
}

/* ---------- zip / xlsx ---------- */
function crc32(buf) {
  if (!crc32.t) {
    const t = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
      t[i] = c >>> 0;
    }
    crc32.t = t;
  }
  let c = 0xffffffff;
  for (let i = 0; i < buf.length; i++) c = crc32.t[(c ^ buf[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}
function u16(n) { return new Uint8Array([n & 255, (n >>> 8) & 255]); }
function u32(n) { return new Uint8Array([n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255]); }
function concat(parts) {
  const len = parts.reduce((s, p) => s + p.length, 0);
  const out = new Uint8Array(len);
  let o = 0;
  for (const p of parts) { out.set(p, o); o += p.length; }
  return out;
}
async function deflateRaw(data) {
  if (typeof CompressionStream === "function") {
    try {
      const cs = new CompressionStream("deflate-raw");
      const stream = new Blob([data]).stream().pipeThrough(cs);
      const buf = await new Response(stream).arrayBuffer();
      return { method: 8, bytes: new Uint8Array(buf) };
    } catch (e) {}
  }
  return { method: 0, bytes: data };
}
async function inflateRaw(data) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([data]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function makeZip(files) {
  const enc = new TextEncoder();
  const locals = [];
  const centrals = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name);
    const data = typeof f.data === "string" ? enc.encode(f.data) : f.data;
    const compressed = await deflateRaw(data);
    const crc = crc32(data);
    const local = concat([
      u32(0x04034b50), u16(20), u16(0), u16(compressed.method),
      u16(0), u16(0), u32(crc), u32(compressed.bytes.length), u32(data.length),
      u16(name.length), u16(0), name, compressed.bytes
    ]);
    const central = concat([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(compressed.method),
      u16(0), u16(0), u32(crc), u32(compressed.bytes.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset),
      name
    ]);
    locals.push(local);
    centrals.push(central);
    offset += local.length;
  }
  const center = concat(centrals);
  const eocd = concat([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(center.length), u32(offset), u16(0)
  ]);
  return concat([...locals, center, eocd]);
}
function parseZip(buf) {
  const v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const files = {};
  let i = 0;
  while (i + 30 <= buf.length) {
    const sig = v.getUint32(i, true);
    if (sig === 0x02014b50 || sig === 0x06054b50) break;
    if (sig !== 0x04034b50) { i += 1; continue; }
    const flag = v.getUint16(i + 6, true);
    const method = v.getUint16(i + 8, true);
    let comp = v.getUint32(i + 18, true);
    let uncomp = v.getUint32(i + 22, true);
    const nlen = v.getUint16(i + 26, true);
    const elen = v.getUint16(i + 28, true);
    const name = new TextDecoder().decode(buf.subarray(i + 30, i + 30 + nlen));
    let start = i + 30 + nlen + elen;
    if (flag & 8) {
      // data descriptor after data; scan for signature if sizes missing
      if (comp === 0 && uncomp === 0) {
        let j = start;
        while (j + 16 <= buf.length) {
          const s = v.getUint32(j, true);
          if (s === 0x08074b50 || s === 0x04034b50 || s === 0x02014b50) {
            if (s === 0x08074b50) {
              comp = v.getUint32(j + 8, true);
              break;
            }
            // descriptor without signature (crc + 2 sizes)
            break;
          }
          j++;
        }
      }
    }
    const data = buf.subarray(start, start + comp);
    files[name] = { method, data, uncomp };
    i = start + comp;
    if (flag & 8) {
      if (i + 4 <= buf.length && v.getUint32(i, true) === 0x08074b50) i += 16;
      else i += 12;
    }
  }
  return files;
}
async function zipRead(buf, name) {
  const files = parseZip(buf);
  const f = files[name];
  if (!f) return null;
  let data = f.data;
  if (f.method === 8) data = await inflateRaw(data);
  else if (f.method !== 0) throw new Error("不支援嘅壓縮方式");
  return data;
}

function xmlEscape(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;" }[ch]));
}
function colLetter(n) {
  let s = "";
  n += 1;
  while (n) { n -= 1; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}
function isNumeric(s) {
  const t = String(s).trim();
  if (t === "") return false;
  return /^-?\d+(\.\d+)?$/.test(t);
}

/* ---------- import ---------- */
function colIndex(ref) {
  const m = String(ref).match(/^([A-Z]+)/i);
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1].toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function parseSharedStrings(xml) {
  if (!xml) return [];
  const out = [];
  const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g;
  let m;
  while ((m = re.exec(xml))) {
    const parts = [];
    const tre = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
    let t;
    while ((t = tre.exec(m[1]))) parts.push(decodeXml(t[1]));
    out.push(parts.join(""));
  }
  return out;
}
function decodeXml(s) {
  return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
}
function parseSheetRows(sheetXml, sst) {
  const rows = [];
  const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while ((rm = rowRe.exec(sheetXml))) {
    const cells = [];
    const cellRe = /<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g;
    let cm;
    while ((cm = cellRe.exec(rm[1]))) {
      const attrs = cm[1] || cm[3] || "";
      const body = cm[2] || "";
      const ref = (attrs.match(/\br="([^"]+)"/) || [])[1] || "";
      const typ = (attrs.match(/\bt="([^"]+)"/) || [])[1] || "";
      let val = "";
      if (typ === "s") {
        const v = (body.match(/<v[^>]*>([\s\S]*?)<\/v>/) || [])[1];
        val = sst[Number(v)] || "";
      } else if (typ === "inlineStr") {
        const parts = [];
        const tre = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
        let t;
        while ((t = tre.exec(body))) parts.push(decodeXml(t[1]));
        val = parts.join("");
      } else {
        const isv = (body.match(/<is[\s\S]*?<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/) || [])[1];
        const v = (body.match(/<v[^>]*>([\s\S]*?)<\/v>/) || [])[1];
        val = decodeXml(isv != null ? isv : (v != null ? v : ""));
      }
      if (ref) cells[colIndex(ref)] = val;
    }
    rows.push(cells);
  }
  return rows;
}
function mapImportedRows(table) {
  if (!table.length) return [];
  let headerAt = -1;
  const aliases = {
    batch: ["batch"],
    treeNo: ["tree no.", "tree no", "tree number", "treeno", "tree_id", "tree id"],
    species: ["species name", "species", "scientific name"],
    h: ["h", "height", "height (m)", "height(m)"],
    s: ["s", "spread", "crown spread", "crown spread (m)", "crown spread(m)"],
    dbh: ["dbh", "dbh (mm)", "dbh(mm)"],
    defect: ["defect", "defects"]
  };
  for (let i = 0; i < Math.min(table.length, 15); i++) {
    const labels = (table[i] || []).map(x => String(x || "").replace(/\s+/g, " ").trim().toLowerCase());
    if (labels.some(x => x === "batch") && labels.some(x => x.includes("tree"))) { headerAt = i; break; }
    if (labels.some(x => x === "tree no.") || labels.some(x => x === "species name")) { headerAt = i; break; }
  }
  if (headerAt < 0) headerAt = table[0] && String(table[0][0] || "").includes("Tree Assessment") ? 1 : 0;
  const headers = (table[headerAt] || []).map(x => String(x || "").replace(/\s+/g, " ").trim().toLowerCase());
  const idx = {};
  COLS.forEach(c => {
    const names = aliases[c.key];
    idx[c.key] = headers.findIndex(h => names.includes(h));
  });
  if (idx.batch < 0 && idx.treeNo < 0) {
    // fallback to A-G order
    COLS.forEach((c, i) => { if (idx[c.key] < 0) idx[c.key] = i; });
  }
  const out = [];
  for (let i = headerAt + 1; i < table.length; i++) {
    const rec = emptyRowWithId();
    COLS.forEach(c => {
      const j = idx[c.key];
      rec[c.key] = j >= 0 ? String(table[i][j] == null ? "" : table[i][j]).trim() : "";
    });
    if (isFilled(rec)) out.push(rec);
  }
  return out;
}

async function importXlsx(buffer) {
  const u8 = new Uint8Array(buffer);
  const sstXml = await zipRead(u8, "xl/sharedStrings.xml");
  const dec = new TextDecoder("utf-8");
  const sst = sstXml ? parseSharedStrings(dec.decode(sstXml)) : [];
  const wbXml = await zipRead(u8, "xl/workbook.xml");
  let sheetPath = "xl/worksheets/sheet1.xml";
  if (wbXml) {
    const wb = dec.decode(wbXml);
    const rels = await zipRead(u8, "xl/_rels/workbook.xml.rels");
    const first = (wb.match(/<sheet\b[^>]*r:id="([^"]+)"/) || [])[1];
    if (first && rels) {
      const relXml = dec.decode(rels);
      const re = new RegExp('<Relationship[^>]*Id="' + first + '"[^>]*Target="([^"]+)"');
      const re2 = new RegExp('<Relationship[^>]*Target="([^"]+)"[^>]*Id="' + first + '"');
      const t = (relXml.match(re) || relXml.match(re2) || [])[1];
      if (t) sheetPath = "xl/" + t.replace(/^\//, "").replace(/^xl\//, "");
    }
  }
  const sheet = await zipRead(u8, sheetPath);
  if (!sheet) throw new Error("搵唔到工作表");
  return mapImportedRows(parseSheetRows(dec.decode(sheet), sst));
}

function importCsv(text) {
  const lines = [];
  let row = [], cur = "", q = false;
  const s = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') { if (s[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); lines.push(row); row = []; cur = ""; }
      else if (ch !== "\r") cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); lines.push(row); }
  return mapImportedRows(lines);
}

async function handleFile(file) {
  try {
    const name = (file.name || "").toLowerCase();
    let rows;
    if (name.endsWith(".csv") || file.type === "text/csv") {
      rows = importCsv(await file.text());
    } else {
      rows = await importXlsx(await file.arrayBuffer());
    }
    if (!rows.length) { toast("檔案裏面未見到可匯入嘅列"); return; }
    state.pendingImport = rows;
    document.getElementById("importMsg").textContent = "讀到 " + rows.length + " 棵。要取代而家嘅資料，定係加到後面？";
    document.getElementById("importDlg").showModal();
  } catch (err) {
    console.error(err);
    toast("匯入失敗：請用 Excel（.xlsx）或 CSV");
  }
}

function applyImport(mode) {
  const rows = state.pendingImport || [];
  state.pendingImport = null;
  document.getElementById("importDlg").close();
  if (!rows.length) return;
  if (mode === "replace") state.rows = rows;
  else {
    const onlyBlank = state.rows.every(r => !isFilled(r));
    state.rows = onlyBlank ? rows : state.rows.concat(rows);
  }
  state.page = 0;
  padToPageMultiple();
  save();
  render();
  toast("已匯入 " + rows.length + " 棵");
}


function currentDefectField() {
  return document.querySelector('tr[data-id="' + state.defectTarget + '"] input[data-key="defect"]');
}
function parseDefects(s) {
  return String(s || "").split(/[,;，；]+/).map(x => x.trim()).filter(Boolean);
}
function renderDefectPicker() {
  const input = currentDefectField();
  const selected = new Set(parseDefects(input ? input.value : ""));
  const q = document.getElementById("defectFilter").value.trim().toLowerCase();
  const chips = document.getElementById("defectChips");
  chips.replaceChildren();
  selected.forEach(d => {
    const sp = document.createElement("span");
    sp.className = "chip";
    sp.textContent = d;
    chips.appendChild(sp);
  });
  const box = document.getElementById("defectChoices");
  box.replaceChildren();
  DEFECTS.filter(d => !q || d.toLowerCase().includes(q)).forEach(d => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = d;
    if (selected.has(d)) b.className = "on";
    b.addEventListener("click", () => {
      if (selected.has(d)) selected.delete(d); else selected.add(d);
      if (input) {
        input.value = [...selected].join(", ");
        input.dispatchEvent(new Event("input"));
      }
      renderDefectPicker();
    });
    box.appendChild(b);
  });
}
function initDefectList() {
  const dl = document.getElementById("defectList");
  DEFECTS.forEach(d => {
    const o = document.createElement("option");
    o.value = d;
    dl.appendChild(o);
  });
}

document.getElementById("job").addEventListener("input", ev => { state.job = ev.target.value; save(); });
document.getElementById("btnPrev").addEventListener("click", () => goPage(-1));
document.getElementById("btnNext").addEventListener("click", () => goPage(1));
document.getElementById("btnExport").addEventListener("click", () => { exportXlsx().catch(err => { console.error(err); toast("匯出失敗"); }); });
document.getElementById("btnHtml").addEventListener("click", exportHtmlBackup);
document.getElementById("btnImport").addEventListener("click", () => document.getElementById("file").click());
document.getElementById("file").addEventListener("change", ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = "";
  if (f) handleFile(f);
});
document.getElementById("btnClear").addEventListener("click", () => {
  if (!confirm("清除全部記錄？呢步唔能還原（已匯出嘅 Excel 唔受影響）。")) return;
  hideKeypad();
  state.rows = [];
  state.page = 0;
  padToPageMultiple();
  save();
  render();
  toast("已清除");
});
document.getElementById("q").addEventListener("input", () => { state.page = 0; render(); });
document.getElementById("importCancel").addEventListener("click", () => { state.pendingImport = null; document.getElementById("importDlg").close(); });
document.getElementById("importAppend").addEventListener("click", () => applyImport("append"));
document.getElementById("importReplace").addEventListener("click", () => applyImport("replace"));
document.getElementById("defectFilter").addEventListener("input", renderDefectPicker);
document.getElementById("defectDone").addEventListener("click", () => document.getElementById("defectDlg").close());
document.getElementById("defectClear").addEventListener("click", () => {
  const input = currentDefectField();
  if (input) { input.value = ""; input.dispatchEvent(new Event("input")); }
  renderDefectPicker();
});
document.addEventListener("keydown", ev => {
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "s") {
    ev.preventDefault();
    exportXlsx().catch(() => toast("匯出失敗"));
  }
});
["dragenter","dragover"].forEach(ev => {
  document.addEventListener(ev, e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
});
document.addEventListener("drop", e => {
  e.preventDefault();
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});

initDefectList();
initNumpad();
load();
render();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
