<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tree Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1b5e3b">
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Tree Assessment Schedule</title>
<style>
  :root {
    --green: #1b5e3b;
    --green-dark: #13462c;
    --green-soft: #e8f3ec;
    --line: #c3cdc7;
    --ink: #1a1a1a;
    --muted: #5c6b62;
    --bg: #e9eee9;
    --card: #fff;
    --danger: #a32020;
    --header-h: 0px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  button, a, .btn { touch-action: manipulation; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 16px;
    line-height: 1.35;
  }
  header.app {
    background: var(--green);
    color: #fff;
    padding: calc(8px + var(--safe-top)) 12px 8px;
  }
  header.app h1 { margin: 0; font-size: 17px; font-weight: 700; }
  header.app .sub { margin: 2px 0 0; font-size: 11px; opacity: .88; }
  header.app .meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 12px;
    align-items: center;
    margin-top: 8px;
  }
  header.app label.job {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    flex: 1;
    min-width: 160px;
  }
  header.app input[type="text"] {
    flex: 1;
    min-width: 0;
    border: 0;
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 16px;
    background: #fff;
    color: var(--ink);
  }
  .count {
    background: rgba(255,255,255,.16);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    white-space: nowrap;
  }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 12px;
    background: #f4f7f5;
    border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .bulk-prefix {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #eef4f0;
    border-bottom: 1px solid var(--line);
  }
  .bulk-prefix .lab { font-size: 14px; font-weight: 700; color: var(--green-dark); }
  .bulk-prefix button {
    min-width: 56px; min-height: 42px; font-size: 16px; font-weight: 700;
    background: #fff; color: var(--green-dark);
  }
  .bulk-prefix button.on { background: var(--green); color: #fff; }
  button, .btn {
    appearance: none;
    border: 1px solid var(--green);
    background: var(--green);
    color: #fff;
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    min-height: 40px;
  }
  button.secondary, .btn.secondary {
    background: #fff;
    color: var(--green-dark);
    border-color: #9cb8a8;
  }
  button.danger {
    background: #fff;
    color: var(--danger);
    border-color: #e0b4b4;
  }
  button:disabled { opacity: .4; cursor: default; }
  button:active { transform: translateY(1px); }
  .pager {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-right: 8px;
    font-size: 14px;
    font-weight: 600;
    color: var(--green-dark);
    white-space: nowrap;
  }
  .search { flex: 1; min-width: 140px; }
  .search input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 16px;
    font-family: inherit;
    min-height: 40px;
  }
  main { padding: 8px 10px calc(16px + var(--safe-bottom)); }
  body.numpad-open main { padding-bottom: 320px; }
  body.species-open main { padding-top: 8px; }
  .sheet-wrap {
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: #fff;
    border: 1px solid #8fa196;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  table.sheet {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
    font-size: 14px;
  }
  table.sheet th, table.sheet td {
    border: 1px solid #b7c2bb;
    padding: 0;
    vertical-align: middle;
  }
  table.sheet th {
    background: #1b5e3b;
    color: #fff;
    font-weight: 600;
    font-size: 12px;
    padding: 6px 3px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 5;
    white-space: nowrap;
  }
  table.sheet th .u { display: block; font-weight: 400; font-size: 10px; opacity: .85; }
  table.sheet col.c-num { width: 26px; }
  table.sheet col.c-batch { width: 42px; }
  table.sheet col.c-tree { width: 76px; }
  table.sheet col.c-sp { width: 118px; }
  table.sheet col.c-h, table.sheet col.c-s, table.sheet col.c-dbh { width: 40px; }
  table.sheet col.c-def { width: 96px; }
  table.sheet col.c-rec { width: 108px; }
  table.sheet col.c-act { width: 44px; }
  table.sheet td.num {
    text-align: center;
    color: #4d5c54;
    font-size: 12px;
    background: #eef3ef;
    font-variant-numeric: tabular-nums;
  }
  table.sheet td.act { text-align: center; padding: 2px; background: #f7faf8; }
  table.sheet td input {
    width: 100%;
    border: 0;
    background: transparent;
    padding: 5px 3px;
    font-size: 14px;
    font-family: inherit;
    min-height: 36px;
    -webkit-user-select: text;
    user-select: text;
    text-overflow: ellipsis;
  }
  table.sheet td.num-col input { text-align: center; font-variant-numeric: tabular-nums; }
  table.sheet tbody tr:nth-child(even) { background: #f6faf7; }
  table.sheet tbody tr.active { background: #e7f4eb; }
  table.sheet td input:focus {
    outline: 2px solid var(--green);
    outline-offset: -2px;
    background: #fffef4;
  }
  table.sheet td.def-cell, table.sheet td.has-pick { position: relative; }
  table.sheet td.def-cell input, table.sheet td.has-pick input { padding-right: 32px; }
  table.sheet button.pick, table.sheet button.icon {
    min-height: 32px;
    padding: 2px 6px;
    font-size: 12px;
    background: #fff;
    border-radius: 6px;
  }
  table.sheet button.pick {
    position: absolute;
    right: 3px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--green-dark);
    border-color: #c5d5cb;
  }
  table.sheet button.icon { color: var(--danger); border-color: #efd0d0; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: #123526;
    color: #fff;
    padding: 10px 16px;
    border-radius: 999px;
    font-size: 14px;
    z-index: 60;
    box-shadow: 0 4px 16px rgba(0,0,0,.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    max-width: 90vw;
  }
  body.numpad-open .toast { bottom: 300px; }
  body.species-open .toast { bottom: 24px; }
  .toast.show { opacity: 1; }
  dialog.modal {
    border: 0;
    border-radius: 14px;
    padding: 0;
    width: min(520px, 94vw);
    box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  dialog.modal::backdrop { background: rgba(0,0,0,.45); }
  .modal-body { padding: 18px 18px 16px; }
  .modal-body h3 { margin: 0 0 8px; font-size: 17px; }
  .modal-body p { margin: 0 0 14px; color: var(--muted); }
  .defect-list {
    max-height: 50vh;
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 8px;
    margin: 8px 0 12px;
  }
  .defect-list button {
    display: block;
    width: 100%;
    text-align: left;
    background: #fff;
    color: var(--ink);
    border: 0;
    border-bottom: 1px solid #eee;
    border-radius: 0;
    min-height: 44px;
    padding: 8px 12px;
  }
  .defect-list button:last-child { border-bottom: 0; }
  .defect-list button.on { background: var(--green-soft); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
  .chip {
    background: var(--green-soft);
    color: var(--green-dark);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 13px;
  }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #file { display: none; }
  #numpad {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    background: #cfd6d1;
    border-top: 1px solid #9aa59e;
    padding: 8px 10px calc(8px + var(--safe-bottom));
    box-shadow: 0 -6px 20px rgba(0,0,0,.16);
  }
  body.numpad-open #numpad { display: block; }
  .numpad-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 420px;
    margin: 0 auto 6px;
  }
  .numpad-bar .lab { flex: 1; font-weight: 700; color: var(--green-dark); font-size: 14px; }
  .numpad-bar button { min-height: 40px; padding: 6px 12px; }
  .numpad-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    max-width: 420px;
    margin: 0 auto;
  }
  .numpad-grid button {
    min-height: 50px;
    font-size: 22px;
    font-weight: 650;
    background: #fff;
    color: #111;
    border: 1px solid #b0b8b3;
    border-radius: 8px;
  }
  .numpad-grid button.wide { font-size: 20px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 16px;
    font-family: inherit;
    min-height: 42px;
  }
  .field input:focus { outline: 2px solid var(--green); outline-offset: 1px; }
  @media print {
    header.app .meta, .toolbar, .bulk-prefix, #numpad, #speciesBar, td.act, th.act, button, .search { display: none !important; }
    body, body.numpad-open { padding: 0; background: #fff; }
    main { padding: 0; }
    .sheet-wrap { box-shadow: none; border: 0; overflow: visible; }
  }

  #speciesBar {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 50;
    background: rgba(0,0,0,.4);
    padding: calc(12px + var(--safe-top)) 16px calc(12px + var(--safe-bottom));
    overflow: auto;
    -webkit-overflow-scrolling: touch;
  }
  body.species-open #speciesBar {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #speciesBar .species-panel {
    width: min(560px, 94vw);
    max-height: min(86vh, 720px);
    overflow: auto;
    background: #f3f7f4;
    border: 1px solid #9aa59e;
    border-radius: 14px;
    padding: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,.28);
  }
  .species-bar-top {
    display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
  }
  .species-bar-top .lab { flex: 1; font-weight: 700; color: var(--green-dark); font-size: 14px; }
  .species-bar-top button { min-height: 40px; padding: 6px 10px; }
  #speciesInput {
    width: 100%;
    border: 2px solid var(--green);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 22px;
    font-family: inherit;
    min-height: 56px;
    background: #fff;
    color: var(--ink);
    -webkit-user-select: text;
    user-select: text;
  }
  #speciesInput:focus { outline: 2px solid var(--green-dark); outline-offset: 1px; }
  .species-suggest {
    max-height: min(36vh, 280px);
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  .species-suggest button {
    display: block; width: 100%; text-align: left; background: #fff; color: var(--ink);
    border: 0; border-bottom: 1px solid #eee; border-radius: 0; min-height: 48px; padding: 8px 12px;
  }
  .species-suggest button:last-child { border-bottom: 0; }
  .species-suggest button.on { background: var(--green-soft); font-weight: 600; }
  .species-suggest .zh { font-weight: 650; }
  .species-suggest .sci { display: block; font-style: italic; color: var(--muted); font-size: 13px; }
  .species-empty { padding: 10px 12px; color: var(--muted); font-size: 14px; }
  .prefixes { display: none; gap: 6px; max-width: 420px; margin: 0 auto 6px; }
  body.mode-treeno .prefixes { display: flex; }
  .prefixes button { flex: 1; min-height: 42px; font-size: 16px; font-weight: 700; background: #fff; color: var(--green-dark); }
  .prefixes button.on { background: var(--green); color: #fff; }
  .numpad-grid button.fn { font-size: 16px; }

</style>
</head>
<body>
<header class="app">
  <h1>Tree Assessment Schedule</h1>
  <p class="sub">離線記錄 · 每頁 20 項 · Batch／Tree No.／尺寸用九宮格 · 品種可打字、手寫或搜尋 TMO 清單</p>
  <div class="meta">
    <label class="job">工程／檔名 <input id="job" type="text" placeholder="可選，用於匯出檔名" autocomplete="off"></label>
    <div class="count" id="count">已記錄 0 棵</div>
  </div>
</header>

<div id="speciesBar">
  <div class="species-panel">
    <div class="species-bar-top">
      <div class="lab">品種（可打字或用 Pencil 手寫）</div>
      <button type="button" class="secondary" id="speciesClear">清空</button>
      <button type="button" class="secondary" id="speciesNext">下一個</button>
      <button type="button" id="speciesDone">完成</button>
    </div>
    <input id="speciesInput" type="text" inputmode="text" enterkeyhint="done" lang="zh-HK" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="寫或輸入中文／學名，例如：細葉榕 或 Ficus">
    <div class="species-suggest" id="speciesSuggest"></div>
  </div>
</div>
<div class="toolbar">
  <div class="pager">
    <button type="button" class="secondary" id="btnPrev">上一頁</button>
    <span id="pageLabel">第 1 / 1 頁</span>
    <button type="button" class="secondary" id="btnNext">下一頁</button>
  </div>
  <button type="button" class="secondary" id="btnUndo" disabled>上一步</button>
  <button type="button" class="secondary" id="btnRedo" disabled>重做</button>
  <button type="button" id="btnExport">匯出 Excel</button>
  <button type="button" class="secondary" id="btnImport">匯入 Excel</button>
  <button type="button" class="secondary" id="btnHtml">下載 HTML 備份</button>
  <button type="button" class="danger" id="btnClear">清除全部</button>
  <div class="search"><input id="q" type="search" placeholder="搜尋 Tree No.／品種／備註／建議" autocomplete="off"></div>
  <input id="file" type="file" accept=".xlsx,.xlsm,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv">
</div>
<div class="bulk-prefix" id="bulkPrefix">
  <span class="lab">按順序填本頁 Tree No.</span>
  <button type="button" data-prefix="T">T</button>
  <button type="button" data-prefix="AT">AT</button>
  <button type="button" data-prefix="TG">TG</button>
</div>
<main>
  <div class="sheet-wrap" id="wrap">
    <table class="sheet" id="table">
      <colgroup>
        <col class="c-num"><col class="c-batch"><col class="c-tree"><col class="c-sp">
        <col class="c-h"><col class="c-s"><col class="c-dbh"><col class="c-def"><col class="c-rec">
      </colgroup>
      <thead>
        <tr>
          <th>#</th>
          <th>Batch</th>
          <th>Tree No.</th>
          <th>Species</th>
          <th>H <span class="u">m</span></th>
          <th>S <span class="u">m</span></th>
          <th>DBH <span class="u">mm</span></th>
          <th>Remarks</th>
          <th>Recommendation</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</main>
<div id="numpad">
  <div class="numpad-bar">
    <div class="lab" id="numpadLabel">H（m）</div>
    <button type="button" class="secondary" id="numpadNext">下一個</button>
    <button type="button" id="numpadDone">完成</button>
  </div>
  <div class="prefixes" id="numpadPrefixes">
    <button type="button" data-prefix="T">T</button>
    <button type="button" data-prefix="AT">AT</button>
    <button type="button" data-prefix="TG">TG</button>
    <button type="button" data-prefix="⭐">⭐</button>
  </div>
  <div class="numpad-grid" id="numpadGrid"></div>
</div>
<div class="toast" id="toast" role="status"></div>
<dialog class="modal" id="clearDlg">
  <div class="modal-body">
    <h3>清除全部記錄？</h3>
    <p id="clearMsg">確定要清除而家全部記錄？此操作會刪除表內所有已填資料。</p>
    <div class="modal-actions">
      <button type="button" class="secondary" id="clearCancel">取消</button>
      <button type="button" class="danger" id="clearConfirm">確認清除</button>
    </div>
  </div>
</dialog>
<dialog class="modal" id="importDlg">
  <div class="modal-body">
    <h3>匯入資料</h3>
    <p id="importMsg"></p>
    <div class="modal-actions">
      <button type="button" class="secondary" id="importCancel">取消</button>
      <button type="button" class="secondary" id="importAppend">加到後面</button>
      <button type="button" id="importReplace">取代現有</button>
    </div>
  </div>
</dialog>
<dialog class="modal" id="defectDlg">
  <div class="modal-body">
    <h3>選擇 Remarks</h3>
    <div class="field"><input id="defectFilter" type="search" placeholder="搜尋備註"></div>
    <div class="chips" id="defectChips"></div>
    <div class="defect-list" id="defectChoices"></div>
    <div class="modal-actions">
      <button type="button" class="secondary" id="defectClear">清空已選</button>
      <button type="button" id="defectDone">完成</button>
    </div>
  </div>
</dialog>
<dialog class="modal" id="recDlg">
  <div class="modal-body">
    <h3>選擇 Recommendation</h3>
    <p>可同時選多項</p>
    <div class="field"><input id="recFilter" type="search" placeholder="搜尋建議"></div>
    <div class="chips" id="recChips"></div>
    <div class="defect-list" id="recChoices"></div>
    <div class="modal-actions">
      <button type="button" class="secondary" id="recClear">清空已選</button>
      <button type="button" id="recDone">完成</button>
    </div>
  </div>
</dialog>
<script id="data-store" type="application/json">null</script>
<datalist id="speciesList"></datalist>
<datalist id="defectList"></datalist>
<datalist id="recList"></datalist>
<script>
const STORAGE_KEY = "field-tree-schedule-v1";
const PAGE_SIZE = 20;
const APP_VER = "20";
const COLS = [
  { key: "batch", label: "Batch" },
  { key: "treeNo", label: "Tree No." },
  { key: "species", label: "Species Name" },
  { key: "h", label: "H", unit: "m" },
  { key: "s", label: "S", unit: "m" },
  { key: "dbh", label: "DBH", unit: "mm" },
  { key: "remarks", label: "Remarks" },
  { key: "recommendation", label: "Recommendation" }

const state = { job: "", rows: [], page: 0, treePrefix: "", pendingImport: null, defectTarget: null, recTarget: null, speciesTarget: null, numTarget: null };

function emptyRow() {
  return { batch: "", treeNo: "", species: "", h: "", s: "", dbh: "", remarks: "", recommendation: "" };
}
function isFilled(row) {
  return COLS.some(c => String(row[c.key] || "").trim() !== "");
}
function filledCount() {
  return state.rows.filter(isFilled).length;
}
function uid() {
  return "r" + Math.random().toString(36).slice(2, 9);
}
function emptyRowWithId() {
  const r = emptyRow();
  r.id = uid();
  return r;
}
function filteredIndexes() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  const idx = [];
  state.rows.forEach((row, i) => {
    if (!q) { idx.push(i); return; }
    const hay = COLS.map(c => row[c.key] || "").join(" ").toLowerCase();
    const zh = zhForSci(row.species);
    if (hay.includes(q) || (zh && zh.toLowerCase().includes(q))) idx.push(i);
  });
  return idx;
}
function pageCount() {
  return Math.max(1, Math.ceil(filteredIndexes().length / PAGE_SIZE));
}
function padToPageMultiple() {
  if (document.getElementById("q").value.trim()) return;
  if (!state.rows.length) {
    for (let i = 0; i < PAGE_SIZE; i++) state.rows.push(emptyRowWithId());
    return;
  }
  const rem = state.rows.length % PAGE_SIZE;
  if (rem !== 0) {
    for (let i = 0; i < PAGE_SIZE - rem; i++) state.rows.push(emptyRowWithId());
  }
}

function load() {
  let data = null;
  const embedded = document.getElementById("data-store").textContent.trim();
  if (embedded && embedded !== "null") {
    try { data = JSON.parse(embedded); } catch (e) {}
  }
  if (!data) {
    try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) {}
  }
  if (data && Array.isArray(data.rows)) {
    state.job = data.job || "";
    state.rows = data.rows.map(r => {
      const row = Object.assign(emptyRow(), r, { id: r.id || uid() });
      if (!String(row.remarks || "").trim() && r.defect) row.remarks = r.defect;
      return row;
    });
    if (typeof data.page === "number") state.page = data.page;
    if (data.treePrefix === "T" || data.treePrefix === "AT" || data.treePrefix === "TG") state.treePrefix = data.treePrefix;
  }
  padToPageMultiple();
  if (state.page > pageCount() - 1) state.page = 0;
}

function save() {
  const payload = { job: state.job, rows: state.rows, page: state.page, treePrefix: state.treePrefix, savedAt: new Date().toISOString(), ver: APP_VER };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(payload)); } catch (e) {}
}

const UNDO_LIMIT = 50;
let undoStack = [];
let redoStack = [];
let undoCoalesce = null;
let restoring = false;

function snapshotData() {
  return JSON.parse(JSON.stringify({ job: state.job, rows: state.rows, page: state.page, treePrefix: state.treePrefix }));
}
function snapshotEqual(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}
function applySnapshot(snap) {
  state.job = snap.job || "";
  state.rows = JSON.parse(JSON.stringify(snap.rows || []));
  state.page = typeof snap.page === "number" ? snap.page : 0;
  state.treePrefix = snap.treePrefix || "";
}
function syncUndoButtons() {
  const u = document.getElementById("btnUndo");
  const r = document.getElementById("btnRedo");
  if (u) u.disabled = !undoStack.length;
  if (r) r.disabled = !redoStack.length;
}
function endUndoCoalesce() { undoCoalesce = null; }
function closeTransientUi() {
  hideKeypad();
  hideSpeciesBar(false);
  ["defectDlg", "recDlg", "importDlg", "clearDlg"].forEach(id => {
    const el = document.getElementById(id);
    if (el && el.open) el.close();
  });
}
function pushUndo(key) {
  if (restoring) return;
  if (key && key === undoCoalesce && undoStack.length) return;
  const snap = snapshotData();
  if (undoStack.length && snapshotEqual(undoStack[undoStack.length - 1], snap)) {
    undoCoalesce = key || null;
    return;
  }
  undoStack.push(snap);
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack = [];
  undoCoalesce = key || null;
  syncUndoButtons();
}
function undo() {
  if (!undoStack.length || restoring) return;
  closeTransientUi();
  endUndoCoalesce();
  restoring = true;
  redoStack.push(snapshotData());
  applySnapshot(undoStack.pop());
  padToPageMultiple();
  save();
  syncBulkPrefixButtons();
  render();
  syncUndoButtons();
  restoring = false;
  toast("已返回上一步");
}
function redo() {
  if (!redoStack.length || restoring) return;
  closeTransientUi();
  endUndoCoalesce();
  restoring = true;
  undoStack.push(snapshotData());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  applySnapshot(redoStack.pop());
  padToPageMultiple();
  save();
  syncBulkPrefixButtons();
  render();
  syncUndoButtons();
  restoring = false;
  toast("已重做");
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2200);
}

function goPage(delta) {
  hideKeypad();
  hideSpeciesBar(true);
  const pages = pageCount();
  if (delta > 0 && state.page >= pages - 1) {
    if (document.getElementById("q").value.trim()) return;
    pushUndo("page");
    endUndoCoalesce();
    for (let i = 0; i < PAGE_SIZE; i++) state.rows.push(emptyRowWithId());
    state.page += 1;

function zhLine(sp) { return (sp.zh || []).join("／"); }
function normSearch(s) {
  return String(s || "")
    .replace(/&times;|&#215;|&#x00d7;|&#xd7;/gi, "x")
    .toLowerCase()
    .replace(/×/g, "x")
    .replace(/['’.]/g, "")
    .replace(/\s+/g, "");
}
const GENUS_ALIASES = {
  magnolia: ["michelia", "yulania"],
  michelia: ["magnolia"],
  yulania: ["magnolia"],
  corymbia: ["eucalyptus"],
  eucalyptus: ["corymbia"]
};
function speciesTokens(text) {
  return String(text || "")
    .replace(/&times;|&#215;|&#x00d7;|&#xd7;/gi, " x ")
    .replace(/[×]/g, " x ")
    .replace(/['’"][^'’"]*['’"]/g, " ")
    .replace(/\b(subsp|ssp|var|cv|f|forma|species)\b\.?/ig, " ")
    .toLowerCase()
    .replace(/[^a-z\s]/g, " ")
    .split(/\s+/)
    .filter(w => w && w !== "x" && w !== "unidentified");
}
function findSpecies(text) {
  const n = normSearch(text);
  if (!n) return null;
  const exact = SPECIES.find(sp => normSearch(sp.sci) === n) ||
    SPECIES.find(sp => (sp.zh || []).some(z => normSearch(z) === n)) ||
    SPECIES.find(sp => (sp.aliases || []).some(a => normSearch(a) === n)) ||
    null;
  if (exact) return exact;
  const tok = speciesTokens(text);
  if (tok.length < 2) return null;
  const genera = [tok[0], ...(GENUS_ALIASES[tok[0]] || [])];
  const hits = SPECIES.filter(sp => {
    const st = speciesTokens(sp.sci);
    return st.length >= 2 && genera.includes(st[0]) && st[1] === tok[1];
  });
  return hits.length ? hits[0] : null;
}
function zhForSci(sci) {
  const sp = findSpecies(sci);
  return sp ? zhLine(sp) : "";
}
function matchSpecies(q) {
  const n = normSearch(q);
  if (!n) return SPECIES.slice();
  return SPECIES.filter(sp => {
    const names = [sp.sci, ...(sp.zh || []), ...(sp.aliases || [])];
    return names.some(x => normSearch(x).includes(n));
  });
}
function resolveSpeciesValue(text) {
  const sp = findSpecies(text);
  return sp ? sp.sci : String(text || "").trim();
}

function speciesDisplay(val) {

  const pageIdx = currentPageIndexes();

  if (willFill || state.treePrefix !== prefix) {
    pushUndo("bulk");
    endUndoCoalesce();
  }
  state.treePrefix = prefix;
  const { last, width } = lastTreeSerial();
  let n = last;
  let first = null, end = null, count = 0;
  pageIdx.forEach(i => {
    if (String(state.rows[i].treeNo || "").trim()) return;
    n += 1;
    const rest = String(n).padStart(width, "0");
    state.rows[i].treeNo = formatTreeNo({ star: false, prefix: prefix, rest: rest });
    if (first == null) first = rest;
    end = rest;
    count += 1;

  syncBulkPrefixButtons();
  render();

function numpadPress(key) {

    if (field === "treeNo") {
      const p = treePrefix(v);
      if (p && v === p) v = "";
      else v = v.slice(0, -1);
    } else v = v.slice(0, -1);
  } else if (key === "清空") {

    v = v === "" ? "0." : v + ".";

  }

}

  const tr = input.closest("tr");

  return data;
}

function xmlEscape(s) {
  return String(s).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&apos;" }[ch]));
}
function colLetter(n) {
  let s = "";
  n += 1;
  while (n) { n -= 1; s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26); }
  return s;
}
function isNumeric(s) {
  const t = String(s).trim();
  if (t === "") return false;
  return /^-?\d+(\.\d+)?$/.test(t);
}

function buildSheetXml(rows) {
  const headers = COLS.map(c => c.label);
  let out = [];
  out.push('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>');
  out.push('<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">');
  out.push('<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');
  const lastRow = Math.max(2 + rows.length, 2);
  out.push('<dimension ref="A1:H' + lastRow + '"/>');
  out.push('<sheetViews><sheetView workbookViewId="0"/></sheetViews>');
  out.push('<sheetFormatPr defaultRowHeight="16"/>');
  out.push('<cols>');
  out.push('<col min="1" max="1" width="12" customWidth="1"/>');
  out.push('<col min="2" max="2" width="14" customWidth="1"/>');
  out.push('<col min="3" max="3" width="18.625" customWidth="1"/>');
  out.push('<col min="4" max="6" width="8" customWidth="1"/>');
  out.push('<col min="7" max="7" width="19.375" customWidth="1"/>');
  out.push('<col min="8" max="8" width="28" customWidth="1"/>');
  out.push('</cols><sheetData>');
  out.push('<row r="1"><c r="A1" t="inlineStr" s="1"><is><t>Tree Assessment Schedule</t></is></c></row>');
  let h = '<row r="2">';
  headers.forEach((name, i) => {
    h += '<c r="' + colLetter(i) + '2" t="inlineStr" s="2"><is><t>' + xmlEscape(name) + '</t></is></c>';
  });
  h += '</row>';
  out.push(h);
  rows.forEach((row, idx) => {
    const r = idx + 3;
    let line = '<row r="' + r + '">';
    COLS.forEach((c, i) => {
      let val = String(row[c.key] == null ? "" : row[c.key]).trim();
      if (c.key === "species") val = speciesDisplay(val);
      if (val === "") return;
      const ref = colLetter(i) + r;
      if ((c.key === "h" || c.key === "s" || c.key === "dbh") && isNumeric(val)) {
        line += '<c r="' + ref + '" s="3"><v>' + val + '</v></c>';
      } else {
        line += '<c r="' + ref + '" t="inlineStr" s="3"><is><t>' + xmlEscape(val) + '</t></is></c>';
      }
    });
    line += '</row>';
    out.push(line);
  });
  out.push('</sheetData>');
  out.push('<pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/>');
  out.push('<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>');
  out.push('</worksheet>');
  return out.join("");
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  const url = URL.createObjectURL(blob);
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function safeName(s) {
  return String(s || "").replace(/[\\/:*?"<>|]+/g, "_").trim();
}
function exportFileName(ext) {
  const d = new Date();
  const stamp = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
  const job = safeName(state.job);
  return (job ? job + "_" : "") + "Tree_Assessment_Schedule_" + stamp + ext;
}

/* ---------- import ---------- */
function colIndex(ref) {
  const m = String(ref).match(/^([A-Z]+)/i);
  if (!m) return 0;
  let n = 0;
  for (const ch of m[1].toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function parseSharedStrings(xml) {
  if (!xml) return [];
  const out = [];
  const re = /<si\b[^>]*>([\s\S]*?)<\/si>/g;
  let m;
  while ((m = re.exec(xml))) {
    const parts = [];
    const tre = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
    let t;
    while ((t = tre.exec(m[1]))) parts.push(decodeXml(t[1]));
    out.push(parts.join(""));
  }
  return out;
}
function decodeXml(s) {
  return String(s).replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,"&");
}
function parseSheetRows(sheetXml, sst) {
  const rows = [];
  const rowRe = /<row\b[^>]*>([\s\S]*?)<\/row>/g;
  let rm;
  while ((rm = rowRe.exec(sheetXml))) {
    const cells = [];
    const cellRe = /<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g;
    let cm;
    while ((cm = cellRe.exec(rm[1]))) {
      const attrs = cm[1] || cm[3] || "";
      const body = cm[2] || "";
      const ref = (attrs.match(/\br="([^"]+)"/) || [])[1] || "";
      const typ = (attrs.match(/\bt="([^"]+)"/) || [])[1] || "";
      let val = "";
      if (typ === "s") {
        const v = (body.match(/<v[^>]*>([\s\S]*?)<\/v>/) || [])[1];
        val = sst[Number(v)] || "";
      } else if (typ === "inlineStr") {
        const parts = [];
        const tre = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
        let t;
        while ((t = tre.exec(body))) parts.push(decodeXml(t[1]));
        val = parts.join("");
      } else {
        const isv = (body.match(/<is[\s\S]*?<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/) || [])[1];
        const v = (body.match(/<v[^>]*>([\s\S]*?)<\/v>/) || [])[1];
        val = decodeXml(isv != null ? isv : (v != null ? v : ""));
      }
      if (ref) cells[colIndex(ref)] = val;
    }
    rows.push(cells);
  }
  return rows;
}
function mapImportedRows(table) {
  if (!table.length) return [];
  let headerAt = -1;
  const aliases = {
    batch: ["batch"],
    treeNo: ["tree no.", "tree no", "tree number", "treeno", "tree_id", "tree id"],
    species: ["species name", "species", "scientific name", "中文名", "品種", "樹種", "種名"],
    h: ["h", "height", "height (m)", "height(m)"],
    s: ["s", "spread", "crown spread", "crown spread (m)", "crown spread(m)"],
    dbh: ["dbh", "dbh (mm)", "dbh(mm)"],
    remarks: ["remarks", "remark", "defect", "defects"],
    recommendation: ["recommendation", "recommendations", "rec"]
  };
  for (let i = 0; i < Math.min(table.length, 15); i++) {
    const labels = (table[i] || []).map(x => String(x || "").replace(/\s+/g, " ").trim().toLowerCase());
    if (labels.some(x => x === "batch") && labels.some(x => x.includes("tree"))) { headerAt = i; break; }
    if (labels.some(x => x === "tree no.") || labels.some(x => x === "species name")) { headerAt = i; break; }
  }
  if (headerAt < 0) headerAt = table[0] && String(table[0][0] || "").includes("Tree Assessment") ? 1 : 0;
  const headers = (table[headerAt] || []).map(x => String(x || "").replace(/\s+/g, " ").trim().toLowerCase());
  const idx = {};
  COLS.forEach(c => {
    const names = aliases[c.key];
    idx[c.key] = headers.findIndex(h => names.includes(h));
  });
  if (idx.batch < 0 && idx.treeNo < 0) {
    // fallback to A-G order
    COLS.forEach((c, i) => { if (idx[c.key] < 0) idx[c.key] = i; });
  }
  const out = [];
  for (let i = headerAt + 1; i < table.length; i++) {
    const rec = emptyRowWithId();
    COLS.forEach(c => {
      const j = idx[c.key];
      rec[c.key] = j >= 0 ? String(table[i][j] == null ? "" : table[i][j]).trim() : "";
    });
    if (rec.species) rec.species = resolveSpeciesValue(rec.species);
    if (isFilled(rec)) out.push(rec);
  }
  return out;
}

async function importXlsx(buffer) {
  const u8 = new Uint8Array(buffer);
  const sstXml = await zipRead(u8, "xl/sharedStrings.xml");
  const dec = new TextDecoder("utf-8");
  const sst = sstXml ? parseSharedStrings(dec.decode(sstXml)) : [];
  const wbXml = await zipRead(u8, "xl/workbook.xml");
  let sheetPath = "xl/worksheets/sheet1.xml";
  if (wbXml) {
    const wb = dec.decode(wbXml);
    const rels = await zipRead(u8, "xl/_rels/workbook.xml.rels");
    const first = (wb.match(/<sheet\b[^>]*r:id="([^"]+)"/) || [])[1];
    if (first && rels) {
      const relXml = dec.decode(rels);
      const re = new RegExp('<Relationship[^>]*Id="' + first + '"[^>]*Target="([^"]+)"');
      const re2 = new RegExp('<Relationship[^>]*Target="([^"]+)"[^>]*Id="' + first + '"');
      const t = (relXml.match(re) || relXml.match(re2) || [])[1];
      if (t) sheetPath = "xl/" + t.replace(/^\//, "").replace(/^xl\//, "");
    }
  }
  const sheet = await zipRead(u8, sheetPath);
  if (!sheet) throw new Error("搵唔到工作表");
  return mapImportedRows(parseSheetRows(dec.decode(sheet), sst));
}

function importCsv(text) {
  const lines = [];
  let row = [], cur = "", q = false;
  const s = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (q) {
      if (ch === '"') { if (s[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else {
      if (ch === '"') q = true;
      else if (ch === ",") { row.push(cur); cur = ""; }
      else if (ch === "\n") { row.push(cur); lines.push(row); row = []; cur = ""; }
      else if (ch !== "\r") cur += ch;
    }
  }
  if (cur.length || row.length) { row.push(cur); lines.push(row); }
  return mapImportedRows(lines);
}

async function handleFile(file) {
  try {
    const name = (file.name || "").toLowerCase();
    let rows;
    if (name.endsWith(".csv") || file.type === "text/csv") {
      rows = importCsv(await file.text());
    } else {
      rows = await importXlsx(await file.arrayBuffer());
    }
    if (!rows.length) { toast("檔案裏面未見到可匯入嘅列"); return; }
    state.pendingImport = rows;
    document.getElementById("importMsg").textContent = "讀到 " + rows.length + " 棵。要取代而家嘅資料，定係加到後面？";
    document.getElementById("importDlg").showModal();
  } catch (err) {
    console.error(err);
    toast("匯入失敗：請用 Excel（.xlsx）或 CSV");
  }
}

function applyImport(mode) {
  const rows = state.pendingImport || [];
  state.pendingImport = null;
  document.getElementById("importDlg").close();
  if (!rows.length) return;
  pushUndo("import");
  endUndoCoalesce();
  if (mode === "replace") state.rows = rows;
  else {
    const onlyBlank = state.rows.every(r => !isFilled(r));
    state.rows = onlyBlank ? rows : state.rows.concat(rows);
  }
  state.page = 0;
  padToPageMultiple();
  save();
  render();
  toast("已匯入 " + rows.length + " 棵");
}


function currentDefectField() {
  return document.querySelector('tr[data-id="' + state.defectTarget + '"] input[data-key="remarks"]');

function parseDefects(s) {
  return String(s || "").split(/[,;，；]+/).map(x => x.trim()).filter(Boolean);
}
function renderDefectPicker() {
  const input = currentDefectField();
  const selected = new Set(parseDefects(input ? input.value : ""));
  const q = document.getElementById("defectFilter").value.trim().toLowerCase();
  const chips = document.getElementById("defectChips");
  chips.replaceChildren();
  selected.forEach(d => {
    const sp = document.createElement("span");
    sp.className = "chip";
    sp.textContent = d;
    chips.appendChild(sp);
  });
  const box = document.getElementById("defectChoices");
  box.replaceChildren();
  DEFECTS.filter(d => !q || d.toLowerCase().includes(q)).forEach(d => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = d;
    if (selected.has(d)) b.className = "on";
    b.addEventListener("click", () => {
      if (selected.has(d)) selected.delete(d); else selected.add(d);
      if (input) {
        input.value = [...selected].join(", ");
        input.dispatchEvent(new Event("input"));
      }
      renderDefectPicker();
    });
    box.appendChild(b);
  });
}
